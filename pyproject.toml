[project]
name = "vajra"
version = "0.1.0"
description = "Project Vajra - thunderstorm and lightning nowcasting decision support (SIH 2026 PS 26072)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "xgboost>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pillow>=10.2",
    "httpx>=0.27",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
deeplearning = ["torch>=2.0"]
data = ["scipy>=1.11", "s3fs>=2024.2", "cdsapi>=0.7.7", "h5netcdf>=1.3", "xarray>=2024.1", "h5py>=3.10", "pyproj>=3.6", "fsspec>=2024.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.vercel]
entrypoint = "api.index:app"
